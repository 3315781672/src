# Build APKs for Kiwi Browser (fork-adapted)
name: build apk

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - arm
          - x86
          - x64
          - all

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 420

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform: ${{ fromJSON(github.event.inputs.arch == 'all' && '["arm", "arm64", "x86", "x64"]' || format('["{0}"]', github.event.inputs.arch)) }}

    steps:
      # ── Display build info ────────────────────────────────────────────
      - name: Build info
        run: |
          echo "Platform: ${{ matrix.platform }}"
          echo "OS: $(lsb_release -ds)"
          df -h /

      # ── Reclaim disk space ────────────────────────────────────────────
      - name: Reclaim disk space
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /opt/ghc 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "After cleanup:"
          df -h /

      # ── Checkout source ──────────────────────────────────────────────
      - name: Checkout Kiwi Browser source
        uses: actions/checkout@v4

      # ── Checkout CIPD dependencies ───────────────────────────────────
      - name: Checkout CIPD dependencies
        uses: actions/checkout@v4
        with:
          repository: kiwibrowser/dependencies
          path: .cipd

      # ── Setup gclient config in parent directory ─────────────────────
      # gclient expects .gclient/.gclient_entries in ~/chromium/
      # and .cipd/ in ~/chromium/
      - name: Setup gclient workspace
        run: |
          # $GITHUB_WORKSPACE = ~/chromium/src
          # We need .gclient and .gclient_entries in ~/chromium/
          # and .cipd symlink there too
          cp .cipd/.gclient ..
          cp .cipd/.gclient_entries ..
          ln -s "$GITHUB_WORKSPACE/.cipd" ../.cipd
          echo "Parent dir contents:"
          ls -la ..

      # ── Install build tools ──────────────────────────────────────────
      # CRITICAL: Chromium 77 build system (.vpython, DEPS hooks) requires
      # Python 2.7. actions/setup-python provides it as `python`.
      # We need BOTH: python2.7 (for the old Chromium hooks) and python3
      # (for modern depot_tools/gclient). setup-python only touches `python`,
      # leaving the system python3 untouched.
      - name: Install Python 2.7 (required by Chromium 77 hooks)
        uses: actions/setup-python@v5
        with:
          python-version: '2.7'

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install system packages
        run: |
          sudo apt-get update
          # Essential packages (NO python-is-python3 — python must stay 2.7)
          sudo apt-get install -y \
            python3 \
            libncurses5 \
            ccache \
            ninja-build \
            libglib2.0-0 \
            libnss3 \
            libfontconfig1 \
            libdbus-1-3 \
            libx11-6 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxrandr2 \
            libxrender1 \
            libxtst6 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libpci3 \
            libasound2 \
            libxkbcommon0 \
            libpango-1.0-0 \
            libcairo2 \
            libatk-bridge2.0-0 \
            libatspi2.0-0 \
            libgdk-pixbuf2.0-0 \
            libgtk-3-0 \
            libcurl4 \
            libgconf-2-4 \
            libssl-dev \
            uuid-dev \
            pkg-config \
            curl \
            git \
            file
          echo "=== Python check ==="
          python --version 2>&1 || echo "python not found"
          python2 --version 2>&1 || echo "python2 not found"
          python3 --version 2>&1 || echo "python3 not found"
          echo "Packages installed."

      - name: Install Chromium build deps
        run: |
          # install-build-deps.sh may fail on ubuntu-22.04 for some packages, use --unsupported
          sudo bash install-build-deps.sh --no-chromeos-fonts --no-prompt --unsupported 2>&1 || echo "Some build deps not installed (non-fatal)"
          # Install sysroots (must use python2.7 — script uses py2 syntax)
          python build/linux/sysroot_scripts/install-sysroot.py --arch=i386 2>&1 || echo "i386 sysroot not available"
          python build/linux/sysroot_scripts/install-sysroot.py --arch=amd64 2>&1 || echo "amd64 sysroot not available"

      # ── Setup depot_tools ────────────────────────────────────────────
      - name: Clone depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      # ── Set up ccache ────────────────────────────────────────────────
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/ccache
          key: kiwi-ccache-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: |
            kiwi-ccache-${{ matrix.platform }}-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache ~/ccache
          cat > ~/.ccache/ccache.conf << 'CCACHEEOF'
          compiler_check = none
          stats = false
          max_size = 10G
          hash_dir = false
          cache_dir = $HOME/ccache
          CCACHEEOF
          echo "CC=ccache clang -Qunused-arguments" >> $GITHUB_ENV
          echo "CXX=ccache clang++ -Qunused-arguments" >> $GITHUB_ENV

      # ── Create output directory ──────────────────────────────────────
      - name: Create output directory
        run: mkdir -p out/android_${{ matrix.platform }}

      # ── Generate signing key ─────────────────────────────────────────
      - name: Generate APK signing key
        run: |
          keytool -genkey -v \
            -keystore keystore.jks \
            -alias dev \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass public_password -keypass public_password \
            -dname "cn=Kiwi Browser (CI), ou=Actions, o=Kiwi Browser, c=GitHub"

      # ── Configure build args ─────────────────────────────────────────
      - name: Generate build configuration
        run: |
          cp .build/android_arm/args.gn out/android_${{ matrix.platform }}/args.gn
          # Replace target_cpu
          sed -i "s#target_cpu = \"arm\"#target_cpu = \"${{ matrix.platform }}\"#" out/android_${{ matrix.platform }}/args.gn
          # Set version name
          sed -i "s#android_default_version_name = \"Git\"#android_default_version_name = \"Git$(date '+%y%m%d')-${{ github.run_id }}\"#" out/android_${{ matrix.platform }}/args.gn
          # Set version code per platform
          case "${{ matrix.platform }}" in
            arm)   VC="$(date '+%y%m%d')1" ;;
            arm64) VC="$(date '+%y%m%d')2" ;;
            x86)   VC="$(date '+%y%m%d')3" ;;
            x64)   VC="$(date '+%y%m%d')4" ;;
          esac
          sed -i "s/android_default_version_code = \"1\"/android_default_version_code = \"$VC\"/" out/android_${{ matrix.platform }}/args.gn
          echo "=== args.gn ==="
          cat out/android_${{ matrix.platform }}/args.gn

      # ── Set Chromium version ─────────────────────────────────────────
      # CRITICAL: use the repo's OWN chrome/VERSION (Chromium 77), do NOT
      # overwrite it with the latest stable — the pinned DEPS won't match.
      - name: Verify Chromium version
        run: |
          echo "=== Repo VERSION ==="
          cat chrome/VERSION
          echo "=== Keeping repo VERSION (do not fetch latest) ==="

      # ── Generate build files ─────────────────────────────────────────
      # NOTE: use pipefail so ninja/gn failures are NOT masked by the tail pipe
      - name: Run gclient hooks
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          # python must resolve to 2.7 for the py2 hooks
          echo "=== python resolved to: $(which python) ==="
          gclient runhooks 2>&1 | tee /tmp/gclient_hooks.log | tail -120
          echo "=== gclient runhooks exit: ${PIPESTATUS[0]} ==="
          echo "=== Toolchain binaries downloaded? ==="
          ls -la buildtools/linux64/gn 2>&1 || echo "MISSING gn!"
          ls third_party/llvm-build/Release+Asserts/bin/clang* 2>&1 | head -5 || echo "MISSING clang!"

      - name: Generate Ninja files
        run: |
          set -o pipefail
          gn gen out/android_${{ matrix.platform }} 2>&1 | tee /tmp/gn_gen.log | tail -120
          echo "=== gn gen exit: ${PIPESTATUS[0]} ==="
          echo "--- build.ninja present? ---"
          ls -la out/android_${{ matrix.platform }}/build.ninja 2>&1 || echo "MISSING build.ninja"
          echo "--- gn error log (if any) ---"
          cat out/android_${{ matrix.platform }}/gn_logs.txt 2>/dev/null | tail -50 || true

      - name: Pre-build status
        run: |
          echo "=== Disk ===" && df -h /
          echo "=== Memory ===" && free -m
          echo "=== ccache ===" && ccache -s 2>/dev/null || echo "ccache empty"

      # ── Compile in stages ────────────────────────────────────────────
      # NOTE: set -o pipefail is CRITICAL — without it, `ninja | tail` masks
      # the real exit code and GitHub marks failed builds as "success".
      # Stage 1: base + content
      - name: Build stage 1 - base + content
        run: |
          set -o pipefail
          ninja -C out/android_${{ matrix.platform }} base 2>&1 | tee /tmp/stage1.log | tail -60
          echo "=== stage1 base exit: ${PIPESTATUS[0]} ==="
          ninja -C out/android_${{ matrix.platform }} content/public/common 2>&1 | tail -60
          ninja -C out/android_${{ matrix.platform }} content/public/browser 2>&1 | tail -60

      # Stage 2: guest_view + gpu
      - name: Build stage 2 - guest_view + gpu
        run: |
          set -o pipefail
          ninja -C out/android_${{ matrix.platform }} components/guest_view/common 2>&1 | tail -60
          ninja -C out/android_${{ matrix.platform }} components/guest_view/renderer 2>&1 | tail -60
          ninja -C out/android_${{ matrix.platform }} chrome/gpu 2>&1 | tail -60

      # Stage 3: Java + UI
      - name: Build stage 3 - Java + UI
        run: |
          set -o pipefail
          ninja -C out/android_${{ matrix.platform }} chrome_java 2>&1 | tail -60
          ninja -C out/android_${{ matrix.platform }} components/version_info 2>&1 | tail -60
          ninja -C out/android_${{ matrix.platform }} ui/base 2>&1 | tail -60
          ninja -C out/android_${{ matrix.platform }} chrome/browser:resources 2>&1 | tail -60

      # Stage 4: chrome browser
      - name: Build stage 4 - chrome browser
        run: |
          set -o pipefail
          ninja -C out/android_${{ matrix.platform }} chrome/browser/ui 2>&1 | tail -60
          ninja -C out/android_${{ matrix.platform }} chrome/browser 2>&1 | tail -60
          ninja -C out/android_${{ matrix.platform }} chrome/common 2>&1 | tail -60
          ninja -C out/android_${{ matrix.platform }} chrome/renderer 2>&1 | tail -60

      # Stage 5: extensions + services
      - name: Build stage 5 - extensions + services
        run: |
          set -o pipefail
          ninja -C out/android_${{ matrix.platform }} extensions 2>&1 | tail -60
          ninja -C out/android_${{ matrix.platform }} services 2>&1 | tail -60

      # Stage 6: v8
      - name: Build stage 6 - v8
        run: |
          set -o pipefail
          ninja -C out/android_${{ matrix.platform }} v8 2>&1 | tail -60

      # Stage 7: final APK
      - name: Pre-APK resource check
        run: |
          echo "=== Disk ===" && df -h /
          echo "=== Memory ===" && free -m
          echo "=== ccache ===" && ccache -s 2>/dev/null || true

      - name: Build final APK
        run: |
          set -o pipefail
          ninja -C out/android_${{ matrix.platform }} chrome_public_apk 2>&1

      # ── Collect failure diagnostics ──────────────────────────────────
      - name: Collect build logs (on failure)
        if: failure()
        run: |
          mkdir -p /tmp/fail-logs
          cp /tmp/gclient_hooks.log /tmp/fail-logs/ 2>/dev/null || true
          cp /tmp/gn_gen.log /tmp/fail-logs/ 2>/dev/null || true
          cp /tmp/stage1.log /tmp/fail-logs/ 2>/dev/null || true
          cp out/android_${{ matrix.platform }}/gn_logs.txt /tmp/fail-logs/ 2>/dev/null || true
          echo "=== gn_logs.txt tail ==="
          tail -80 out/android_${{ matrix.platform }}/gn_logs.txt 2>/dev/null || echo "no gn_logs.txt"
          echo "=== ninja log tail (build.ninja) ==="
          ls -la out/android_${{ matrix.platform }}/ 2>/dev/null | head -30
          echo "=== error files ==="
          find out/android_${{ matrix.platform }}/ -name "*.stamp" -newer /tmp/gn_gen.log 2>/dev/null | head -5 || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fail-diagnostics-${{ matrix.platform }}
          path: /tmp/fail-logs/
          if-no-files-found: ignore

      - name: Post-build ccache stats
        if: always()
        run: ccache -s 2>/dev/null || true

      # ── List APK output ──────────────────────────────────────────────
      - name: List APK output
        run: |
          echo "=== APK files ==="
          find out/android_${{ matrix.platform }}/apks/ -type f -ls 2>/dev/null || echo "No apks directory found"
          echo "=== All .apk files in out/ ==="
          find out/ -name "*.apk" -type f -ls 2>/dev/null || echo "No .apk files found"

      # ── Upload artifact ──────────────────────────────────────────────
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.platform }}
          path: |
            out/android_${{ matrix.platform }}/apks/*.apk
            out/android_${{ matrix.platform }}/apks/*.mapping
          if-no-files-found: warn

  # ── Release job ─────────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: build
    if: always() && !cancelled()
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: List artifacts
        run: find apks -type f -ls

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "Kiwi Browser Build #${{ github.run_id }}"
          body: |
            ## Kiwi Browser (classic) - CI Build

            **Build**: `#${{ github.run_id }}`
            **Date**: `$(date -u '+%Y-%m-%d %H:%M UTC')`
            **Source**: [${{ github.repository }}](https://github.com/${{ github.repository }})

            ### 📱 Install

            Download the APK matching your device:
            - **arm64-v8a** — most modern phones (Samsung, Pixel, Xiaomi, etc.)
            - **armeabi-v7a** — older 32-bit phones
            - **x86 / x86_64** — Android emulator

            > ⚠️ **Unsigned build** — enable "Install from unknown sources" in Android settings.

            ### ℹ️ About
            Based on [Kiwi Browser](https://github.com/kiwibrowser/src) with Chrome Extension support, Night Mode, and bottom address bar. Licensed under Chromium's license.
          draft: false
          prerelease: true
          files: apks/**/ChromePublic.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
